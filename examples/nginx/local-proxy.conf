# Include this file inside the nginx.conf http block.
# Nginx and the service on port 22993 must run on the same host.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:22993;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        # Sailfin auto injection
        sub_filter '</head>' '<script type="module" src="/__sailfin/boot.js"></script></head>';
        proxy_set_header Accept-Encoding "";
    }

    # Sailfin automatic collection
    location ^~ /__sailfin/ {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Sailfin-Site "";
        include "/Users/u679c/Desktop/code/埋点系统/var/.nginx-relay-auth.conf";
        proxy_set_header X-Sailfin-Origin "$scheme://$http_host";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 10s;
    }
}
