# Example inside the http context. Adjust ports, log path and upstream.
# For an existing site, merge the relevant directives into its server block.
server {
    listen 127.0.0.1:9080;
    server_name localhost;
    access_log /absolute/path/to/local-web.access.log combined;

    location ^~ /__sailfin/ {
        access_log off;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Sailfin-Site local-web;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_cache off;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script type="module" src="/__sailfin/sailfin-boot.js"></script></head>';
        sub_filter_once on;
    }
}
